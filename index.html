<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>手写数字识别</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f2f2f2;
    color: #222;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px 14px 28px;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 4px 0 4px;
    letter-spacing: 1px;
  }
  .sub {
    font-size: 13px;
    color: #777;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .board {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    background: #fff;
    cursor: crosshair;
  }
  .tools {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  button {
    flex: 1;
    padding: 12px 0;
    font-size: 15px;
    font-family: inherit;
    color: #333;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
  }
  button:active { background: #eee; }
  button.primary {
    color: #fff;
    background: #333;
    border-color: #333;
  }
  button.primary:active { background: #555; }

  .result { margin-top: 16px; }
  .big {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
  }
  .big span.num {
    font-size: 34px;
    line-height: 1;
    font-weight: 600;
    min-width: 34px;
    text-align: center;
  }
  .big span.txt {
    font-size: 13px;
    color: #777;
    line-height: 1.5;
  }
  .bars {
    margin-top: 12px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px 14px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
  }
  .row .d {
    width: 16px;
    font-size: 13px;
    color: #444;
    text-align: right;
  }
  .row .track {
    flex: 1;
    height: 10px;
    background: #f0f0f0;
    border-radius: 5px;
    overflow: hidden;
  }
  .row .fill {
    height: 100%;
    width: 0;
    background: #bbb;
    border-radius: 5px;
    transition: width .18s ease-out;
  }
  .row.top .fill { background: #333; }
  .row.top .d { font-weight: 600; color: #111; }
  .row .p {
    width: 52px;
    font-size: 12px;
    color: #777;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .row.top .p { color: #111; }
  .foot {
    margin-top: 14px;
    font-size: 12px;
    color: #999;
    line-height: 1.7;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>手写数字识别</h1>
  <div class="sub">在下面的方框里写一个 0 到 9 的数字，手指松开后自动识别。</div>

  <div class="board">
    <canvas id="pad"></canvas>
  </div>

  <div class="tools">
    <button id="clear">清空重写</button>
    <button id="run" class="primary">识别</button>
  </div>

  <div class="result">
    <div class="big">
      <span class="num" id="pred">–</span>
      <span class="txt" id="msg">还没写东西</span>
    </div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

}

function move(e) {
  if (!drawing) return;
  e.preventDefault();
  var p = pos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  lastX = p.x; lastY = p.y;
}

function end(e) {
  if (!drawing) return;
  e.preventDefault();
  drawing = false;
  ctx.beginPath();
  if (hasInk) recognize();
}

pad.addEventListener('pointerdown', start);
pad.addEventListener('pointermove', move);
pad.addEventListener('pointerup', end);
pad.addEventListener('pointercancel', end);
pad.addEventListener('pointerleave', end);

/* ---------- 图像预处理：模仿 MNIST 的输入格式 ---------- */
function toInput() {
  var img = ctx.getImageData(0, 0, PAD, PAD).data;
  var minX = PAD, minY = PAD, maxX = -1, maxY = -1;
  var i, x, y;

  // 找出笔迹范围（白底黑字，所以墨迹 = 255 - 灰度）
  for (y = 0; y < PAD; y++) {
    for (x = 0; x < PAD; x++) {
      i = (y * PAD + x) * 4;
      if (img[i] < 200) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;

  var bw = maxX - minX + 1, bh = maxY - minY + 1;

  // 笔迹的重心，MNIST 的样本是按重心对齐到画面中心的
  var sx = 0, sy = 0, sw = 0, v;
  for (y = minY; y <= maxY; y++) {
    for (x = minX; x <= maxX; x++) {
      i = (y * PAD + x) * 4;
      v = 255 - img[i];
      if (v > 30) { sx += v * x; sy += v * y; sw += v; }
    }
  }
  var cx = sx / sw, cy = sy / sw;

  // 把长边缩到 20 像素（MNIST 里数字就占 20x20 的框），再让重心落在 14,14
  var scale = 20 / Math.max(bw, bh);
  var input = new Float32Array(784);
  var subs = 4;                      // 每个目标像素在源区域取 4x4 个子样本做平均
  var step = 1 / (scale * subs);

  for (var ty = 0; ty < 28; ty++) {
    for (var tx = 0; tx < 28; tx++) {
      // 目标像素中心对应的原图坐标
      var fx = (tx + 0.5 - 14) / scale + cx;
      var fy = (ty + 0.5 - 14) / scale + cy;
      var sum = 0, n = 0;
      for (var a = 0; a < subs; a++) {
        var yy = Math.round(fy + (a - subs / 2 + 0.5) * step);
        if (yy < 0 || yy >= PAD) continue;
        for (var b = 0; b < subs; b++) {
          var xx = Math.round(fx + (b - subs / 2 + 0.5) * step);
          if (xx < 0 || xx >= PAD) continue;
          sum += 255 - img[(yy * PAD + xx) * 4];
          n++;
        }
      }
      var ink = n > 0 ? sum / n : 0;
      // 归一化：先缩到 0~1，再按训练时的均值方差标准化
      input[ty * 28 + tx] = (ink / 255 - 0.1307) / 0.3081;
    }
  }
  return input;
}

/* ---------- 前向计算 ---------- */
function forward(input) {
  var h = new Float32Array(256);
  var j, i, s;

  // 第一层 + ReLU
  for (i = 0; i < 256; i++) h[i] = B1[i];
  for (j = 0; j < 784; j++) {
    var xj = input[j];
    if (xj === 0) continue;
    var off = j;
    for (i = 0; i < 256; i++) h[i] += W1[i * 784 + off] * xj;
  }
  for (i = 0; i < 256; i++) if (h[i] < 0) h[i] = 0;

  // 第二层
  var logits = new Float32Array(10);
  for (i = 0; i < 10; i++) {
    s = B2[i];
    for (j = 0; j < 256; j++) s += W2[i * 256 + j] * h[j];
    logits[i] = s;
  }

  // softmax 转概率
  var mx = logits[0];
  for (i = 1; i < 10; i++) if (logits[i] > mx) mx = logits[i];
  var sum = 0, probs = new Float32Array(10);
  for (i = 0; i < 10; i++) { probs[i] = Math.exp(logits[i] - mx); sum += probs[i]; }
  for (i = 0; i < 10; i++) probs[i] /= sum;
  return probs;
}

/* ---------- 结果展示 ---------- */
var barsBox = document.getElementById('bars');
var rows = [];
(function makeRows() {
  for (var d = 0; d < 10; d++) {
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="d">' + d + '</div>' +
                    '<div class="track"><div class="fill"></div></div>' +
                    '<div class="p">0.0%</div>';
    barsBox.appendChild(row);
    rows.push({
      row: row,
      fill: row.querySelector('.fill'),
      p: row.querySelector('.p')
    });
  }
})();

function show(probs) {
  var best = 0;
  for (var i = 1; i < 10; i++) if (probs[i] > probs[best]) best = i;

  document.getElementById('pred').textContent = best;
  document.getElementById('msg').innerHTML =
    '识别为 <b>' + best + '</b>　把握 ' + (probs[best] * 100).toFixed(1) + '%';

  for (var d = 0; d < 10; d++) {
    var pct = probs[d] * 100;
    rows[d].fill.style.width = pct.toFixed(1) + '%';
    rows[d].p.textContent = pct.toFixed(1) + '%';
    rows[d].row.className = 'row' + (d === best ? ' top' : '');
  }
}

function recognize() {
  var input = toInput();
  if (!input) return;
  show(forward(input));
}

document.getElementById('clear').addEventListener('click', function () {
  clearPad();
  document.getElementById('pred').textContent = '–';
  document.getElementById('msg').textContent = '还没写东西';
  for (var d = 0; d < 10; d++) {
    rows[d].fill.style.width = '0%';
    rows[d].p.textContent = '0.0%';
    rows[d].row.className = 'row';
  }
});
document.getElementById('run').addEventListener('click', recognize);

document.getElementById('foot').innerHTML =
  '模型：784 - 256 - 10 全连接网络，ReLU + Softmax，测试集准确率 ' +
  MODEL_DATA.acc + '%';

clearPad();
</script>
